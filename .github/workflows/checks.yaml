name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.20
          python -m uv sync --project apps/api --locked
          pnpm install --frozen-lockfile
      - name: Security and dependency audit
        run: |
          pnpm audit --prod
      - name: Initialize local infrastructure
        run: |
          pnpm setup:env
          docker compose --env-file .env -f infra/compose.yaml config --quiet
          docker compose --env-file .env -f infra/compose.prod.yaml config --quiet
          pnpm infra:up
          pnpm db:migrate
      - name: Validate foundation
        run: |
          pnpm check
      - name: Validate proxied session authentication
        run: |
          pnpm dev:api > api.log 2>&1 &
          api_pid=$!
          pnpm dev:web > web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/api/v1/auth/csrf; then
              break
            fi
            sleep 1
          done
          python -m uv run --project apps/api --env-file .env python scripts/smoke_auth.py
          git diff --exit-code -- docs/openapi.yaml
      - name: Build and validate production containers
        run: |
          docker build -t quick-commerce-api:ci -f apps/api/Dockerfile apps/api
          docker build -t quick-commerce-web:ci -f apps/web/Dockerfile .
          test "$(docker run --rm quick-commerce-api:ci whoami)" = "appuser"
          test "$(docker run --rm quick-commerce-web:ci whoami)" = "nextjs"
      - name: Stop infrastructure
        if: always()
        run: docker compose --env-file .env -f infra/compose.yaml down
