[project]
name = "quick-commerce-api"
version = "0.1.0"
description = "Django modular monolith for marketplace administration"
requires-python = ">=3.14,<3.15"
dependencies = [
  "django==5.2.17",
  "djangorestframework==3.18.1",
  "drf-spectacular==0.30.0",
  "psycopg[binary]==3.3.6",
  "argon2-cffi==25.1.0",
  "django-axes==8.3.1",
  "django-storages[s3]==1.14.6",
  "pillow==12.3.0",
  "celery==5.6.3",
  "redis==8.1.0",
  "gunicorn==26.2.0",
]

[dependency-groups]
dev = [
  "django-stubs[compatible-mypy]==6.1.1",
  "djangorestframework-stubs==3.18.1",
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "ruff==0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["axes.*", "celery.*", "kombu.*", "redis.*", "sentry_sdk.*"]
# Third-party integrations lacking stubs.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apps.events.tasks"]
disallow_untyped_decorators = false

[tool.django-stubs]
django_settings_module = "config.settings.development"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --tb=short --strict-markers"
filterwarnings = ["error"]
