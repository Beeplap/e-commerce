openapi: 3.0.3
info:
  title: Quick Commerce API
  version: 1.0.0
  description: Session-authenticated marketplace administration API.
paths:
  /api/v1/admin/access:
    get:
      operationId: admin_access_retrieve
      description: CSRF applies even to anonymous unsafe browser requests, including
        login.
      tags:
      - Platform access
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/admin/sellers:
    get:
      operationId: admin_sellers_list
      description: CSRF applies even to anonymous unsafe browser requests, including
        login.
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          maximum: 10000
          minimum: 1
      - in: query
        name: search
        schema:
          type: string
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - pending
          - active
          - suspended
          - rejected
          - closed
          type: string
          minLength: 1
        description: |-
          * `pending` - Pending
          * `active` - Active
          * `suspended` - Suspended
          * `rejected` - Rejected
          * `closed` - Closed
      - in: query
        name: verification_status
        schema:
          enum:
          - pending
          - verified
          - rejected
          type: string
          minLength: 1
        description: |-
          * `pending` - Pending
          * `verified` - Verified
          * `rejected` - Rejected
      tags:
      - Platform sellers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerListPage'
          description: ''
