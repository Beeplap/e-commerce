components:
  schemas:
    AddTrackingEventInput:
      type: object
      properties:
        status:
          type: string
          maxLength: 32
        location:
          type: string
          default: ''
          maxLength: 255
        description:
          type: string
          default: ''
      required:
      - status
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          $ref: '#/components/schemas/KindEnum'
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        region:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 2
      required:
      - city
      - country
      - id
      - kind
      - line1
    AddressInput:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          default: ''
          maxLength: 200
        city:
          type: string
          maxLength: 100
        region:
          type: string
          default: ''
          maxLength: 100
        postal_code:
          type: string
          default: ''
          maxLength: 20
        country:
          type: string
          maxLength: 2
          pattern: ^[A-Z]{2}$
      required:
      - city
      - country
      - kind
      - line1
    AdminBalanceAdjustment:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        description:
          type: string
          maxLength: 500
          minLength: 3
      required:
      - amount
      - description
    AdminFinanceSummary:
      type: object
      properties:
        total_gross_sales:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        total_commissions:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        total_available_balances:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        total_pending_balances:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        total_paid_out:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        pending_payouts_count:
          type: integer
        active_plans_count:
          type: integer
      required:
      - active_plans_count
      - pending_payouts_count
      - total_available_balances
      - total_commissions
      - total_gross_sales
      - total_paid_out
      - total_pending_balances
    AdminSellerBalance:
      type: object
      properties:
        seller_id:
          type: string
          format: uuid
          readOnly: true
        seller_name:
          type: string
          readOnly: true
        seller_slug:
          type: string
          readOnly: true
        currency:
          type: string
          maxLength: 3
        current_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        pending_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        total_paid_out:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - seller_id
      - seller_name
      - seller_slug
      - updated_at
    AdminSellerBalancePage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminSellerBalance'
      required:
      - count
      - next
      - previous
      - results
    ApproveReturnInput:
      type: object
      properties:
        return_carrier:
          type: string
          default: ''
          maxLength: 64
        return_tracking_number:
          type: string
          default: ''
          maxLength: 120
    AttributeInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        code:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        value_type:
          $ref: '#/components/schemas/ValueTypeEnum'
        scope:
          $ref: '#/components/schemas/AttributeScopeEnum'
        is_active:
          type: boolean
          default: true
      required:
      - code
      - name
      - scope
      - value_type
    AttributeOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
