components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          $ref: '#/components/schemas/KindEnum'
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        region:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 2
      required:
      - city
      - country
      - id
      - kind
      - line1
    AddressInput:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          default: ''
          maxLength: 200
        city:
          type: string
          maxLength: 100
        region:
          type: string
          default: ''
          maxLength: 100
        postal_code:
          type: string
          default: ''
          maxLength: 20
        country:
          type: string
          maxLength: 2
          pattern: ^[A-Z]{2}$
      required:
      - city
      - country
      - kind
      - line1
    Audit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor_id:
          type: string
          format: uuid
        action:
          type: string
          maxLength: 80
        target_type:
          type: string
          maxLength: 80
        target_id:
          type: string
          format: uuid
        changes: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_id
      - created_at
      - id
      - target_id
      - target_type
    AuditPage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Audit'
      required:
      - count
      - next
      - previous
      - results
    CSRF:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    DefaultCurrencyEnum:
      enum:
      - USD
      - NPR
      - INR
      - EUR
      - GBP
      type: string
      description: |-
        * `USD` - USD
        * `NPR` - NPR
        * `INR` - INR
        * `EUR` - EUR
        * `GBP` - GBP
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        document_type:
          allOf:
          - $ref: '#/components/schemas/DocumentTypeEnum'
          readOnly: true
        content_type:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/SellerVerificationStatusEnum'
          readOnly: true
        verified_by_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        rejection_reason:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content_type
      - created_at
      - document_type
      - expires_at
      - id
      - rejection_reason
      - size
      - status
      - verified_at
      - verified_by_id
    DocumentInput:
      type: object
      properties:
        document_type:
          $ref: '#/components/schemas/DocumentTypeEnum'
        file:
          type: string
          format: uri
          writeOnly: true
        expires_at:
          type: string
          format: date
          nullable: true
      required:
      - document_type
      - file
    DocumentPage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Document'
      required:
      - count
      - next
      - previous
      - results
    DocumentTypeEnum:
      enum:
      - registration
      - tax
      type: string
      description: |-
        * `registration` - Business registration
